<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>ISSAT Sousse - Répertoire Académique</title>
    <link rel="icon" type="image/jpeg" href="/logo%20issat-small.jpg">
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap"
        rel="stylesheet" />
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        :root {
            --bg: #F5F3EE;
            --surface: #FFF;
            --surface2: #F9F7F3;
            --border: #E2DDD5;
            --border2: #CFC9BE;
            --navy: #1B3A6B;
            --navy2: #254D8F;
            --amber: #C67C0D;
            --amber-lt: #FDF3E0;
            --green: #2D6A4F;
            --green-lt: #E8F5EE;
            --red: #B02A37;
            --red-lt: #FDECEA;
            --text: #1A1714;
            --text2: #4A453E;
            --text3: #8C8078;
            --sh: 0 1px 4px rgba(0, 0, 0, .07), 0 4px 16px rgba(0, 0, 0, .05);
            --sh2: 0 2px 8px rgba(0, 0, 0, .10), 0 8px 32px rgba(0, 0, 0, .07);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0
        }

        html {
            scroll-behavior: smooth
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
            font-size: 14px;
            line-height: 1.5
        }

        .w {
            max-width: 1400px;
            margin: 0 auto;
            padding: 28px 24px
        }

        .hdr {
            background: var(--navy);
            border-radius: 16px;
            padding: 28px 36px;
            margin-bottom: 22px;
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            align-items: center;
            justify-content: space-between;
            box-shadow: var(--sh2);
            position: relative;
            overflow: hidden
        }

        .hdr::before {
            content: '';
            position: absolute;
            inset: 0;
            background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none'%3E%3Cg fill='%23fff' fill-opacity='0.03'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E") repeat
        }

        .hdr-title {
            position: relative
        }

        .eyebrow {
            font-size: 10px;
            letter-spacing: 3px;
            color: #92AACF;
            text-transform: uppercase;
            font-weight: 600;
            margin-bottom: 6px
        }

        .hdr h1 {
            font-family: 'DM Serif Display', serif;
            font-size: 28px;
            color: #fff;
            line-height: 1.1;
            margin-bottom: 4px
        }

        .hdr-sub {
            font-size: 12px;
            color: #6B8BBF
        }

        .stats-row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            position: relative
        }

        .sbox {
            background: rgba(255, 255, 255, .09);
            border: 1px solid rgba(255, 255, 255, .12);
            border-radius: 10px;
            padding: 12px 18px;
            min-width: 110px
        }

        .slbl {
            font-size: 10px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: #92AACF;
            font-weight: 600;
            margin-bottom: 4px
        }

        .sval {
            font-family: 'DM Serif Display', serif;
            font-size: 24px;
            color: #fff
        }

        .ctrl {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px 20px;
            margin-bottom: 16px;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
            box-shadow: var(--sh)
        }

        .tg {
            display: flex;
            gap: 4px;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 4px
        }

        .tab {
            padding: 7px 18px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-family: 'DM Sans', sans-serif;
            font-size: 13px;
            font-weight: 600;
            transition: all .2s;
            color: var(--text3);
            background: transparent
        }

        .tab.on {
            background: var(--navy);
            color: #fff;
            box-shadow: 0 2px 8px rgba(27, 58, 107, .3)
        }

        .tab:hover:not(.on) {
            background: var(--border);
            color: var(--text2)
        }

        .srch {
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 8px 12px;
            font-family: 'DM Sans', sans-serif;
            font-size: 13px;
            color: var(--text);
            background: var(--surface2);
            outline: none;
            width: 220px;
            transition: border .2s
        }

        .srch:focus {
            border-color: var(--navy2);
            background: #fff
        }

        .btn-navy {
            background: var(--navy);
            color: #fff;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            text-decoration: none;
            transition: transform 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-navy:hover {
            transform: translateY(-1px);
            filter: brightness(1.1);
        }

        /* Sidebar Filter System */
        .page-wrapper {
            display: flex;
            gap: 24px;
            margin-top: 24px;
            min-height: 80vh;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .filter-sidebar {
            width: 280px;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            height: fit-content;
            position: sticky;
            top: 24px;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            opacity: 1;
            transform-origin: left;
            overflow: hidden;
        }

        /* Hidden State - Desktop */
        .sidebar-collapsed .filter-sidebar {
            width: 0;
            padding: 0;
            border: none;
            margin-right: -24px;
            opacity: 0;
            pointer-events: none;
            transform: translateX(-20px);
        }

        .filter-group {
            margin-bottom: 24px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 16px;
        }

        .filter-group:last-child { border-bottom: none; }

        .filter-title {
            font-family: 'DM Sans', sans-serif;
            font-size: 14px;
            font-weight: 700;
            color: var(--navy);
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .filter-options {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .filter-option {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            font-size: 13px;
            color: var(--text2);
            transition: color 0.2s;
        }

        .filter-option:hover { color: var(--navy); }

        /* Custom Checkbox */
        .cb-container {
            width: 18px;
            height: 18px;
            border: 2px solid var(--border);
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            flex-shrink: 0;
            background: #fff;
        }

        .filter-option.active .cb-container {
            background: var(--navy);
            border-color: var(--navy);
        }

        .cb-mark {
            width: 8px;
            height: 4px;
            border-left: 2px solid #fff;
            border-bottom: 2px solid #fff;
            transform: rotate(-45deg) translateY(-1px);
            opacity: 0;
        }

        .filter-option.active .cb-mark { opacity: 1; }

        .count-pill {
            margin-left: auto;
            font-size: 11px;
            font-weight: 500;
            color: var(--text3);
            opacity: 0.6;
        }

        .main-content {
            flex-grow: 1;
            min-width: 0;
        }

        /* Mobile Adjustments */
        @media (max-width: 1024px) {
            .page-wrapper { flex-direction: column; }
            .filter-sidebar { 
                width: 100%; 
                position: fixed; 
                top: 0; left: 0; right: 0; bottom: 0;
                z-index: 2000;
                transform: translateX(-100%);
                border-radius: 0;
            }
            .filter-sidebar.open { transform: translateX(0); }
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            box-shadow: var(--sh);
            transition: all 0.3s ease;
        }

        .card:hover {
            box-shadow: var(--sh2);
            border-color: var(--border2);
            transform: translateY(-2px);
        }

        .badge {
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 4px 10px;
            border-radius: 6px;
        }

        .badge-navy { background: var(--amber-lt); color: var(--amber); }

        /* Table Styling */
        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
        }

        th {
            background: var(--surface2);
            padding: 14px 16px;
            text-align: left;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text3);
            border-bottom: 2px solid var(--border);
            cursor: pointer;
            transition: background 0.2s;
        }

        th:hover {
            background: var(--border);
            color: var(--navy);
        }

        td {
            padding: 16px;
            border-bottom: 1px solid var(--border);
            font-size: 13px;
            color: var(--text2);
            transition: background 0.2s;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover td {
            background: rgba(198, 124, 13, 0.03); /* Subtle Amber hover */
        }

        /* Status & Grade Badges */
        .badge-status {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
        }
        .status-on { background: #ECFDF5; color: #059669; }
        .status-off { background: #FEF2F2; color: #DC2626; }
        .dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; }
        .dot-on { background: #10B981; }
        .dot-off { background: #EF4444; }

        .badge-grade {
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 10px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .grade-prof { background: #E0E7FF; color: #3730A3; }
        .grade-maitre { background: #FEF3C7; color: #92400E; }
        .grade-assistant { background: #F3F4F6; color: #4B5563; }
        .grade-default { background: var(--bg); color: var(--text3); }

        /* Graph Container */
        #graph-container {
            background: var(--surface2) !important;
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.02);
            position: relative;
        }

        .graph-legend {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(4px);
            padding: 12px;
            border-radius: 12px;
            border: 1px solid var(--border);
            z-index: 10;
        }

        .legend-item { display: flex; align-items: center; gap: 8px; font-size: 11px; font-weight: 600; color: var(--text3); margin-bottom: 4px; }
        .legend-dot { width: 8px; height: 8px; border-radius: 50%; }

        .tooltip {
            position: absolute;
            background: var(--navy);
            color: #fff;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 12px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s;
            z-index: 100;
        }

        /* Modal Theme */
        .modal {
            position: fixed;
            inset: 0;
            z-index: 1000;
            background: rgba(26, 23, 20, 0.4);
            backdrop-filter: blur(4px);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-content {
            background: var(--surface);
            border-radius: 20px;
            width: 100%;
            max-width: 800px;
            max-height: 85vh;
            display: flex;
            flex-direction: column;
            box-shadow: var(--sh2);
            overflow: hidden;
            border: 1px solid var(--border);
        }

        .modal-header-sticky {
            background: var(--surface2);
            padding: 24px 32px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-title-text {
            font-family: 'DM Serif Display', serif;
            font-size: 24px;
            color: var(--navy);
        }

        .modal-body {
            padding: 32px;
            overflow-y: auto;
        }

        .close-btn {
            background: var(--border);
            color: var(--text2);
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
        }

        .close-btn:hover {
            background: var(--red-lt);
            color: var(--red);
        }

        .subject-card {
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 14px;
            transition: all 0.2s;
        }

        .subject-card:hover {
            border-color: var(--navy);
            background: var(--surface);
        }

        .type-badge {
            font-size: 9px;
            font-weight: 800;
            padding: 2px 8px;
            border-radius: 4px;
        }

        .type-ds { background: var(--amber-lt); color: var(--amber); }
        .type-examen { background: var(--green-lt); color: var(--green); }
        .type-none { background: var(--red-lt); color: var(--red); opacity: 0.8; }
        
        .border-red { border-left-color: var(--red) !important; }
        .border-amber { border-left-color: var(--amber) !important; }
        .border-navy { border-left-color: var(--navy) !important; }
    </style>
</head>
<body class="font-sans">
    <div class="w">
        <!-- Header -->
        <header class="hdr">
            <div class="hdr-title flex items-center gap-6">
                <div class="bg-white/10 p-2 rounded-xl backdrop-blur-sm border border-white/10 flex items-center justify-center">
                    <img src="/logo%20issat-small.jpg" alt="ISSAT Logo" class="h-14 w-auto rounded-lg">
                </div>
                <div>
                    <div class="eyebrow">Institut Supérieur des Sciences Appliquées et de Technologie de Sousse</div>
                    <h1>Explorateur Académique</h1>
                    <div class="text-[10px] text-white/50 font-bold uppercase tracking-widest mt-1">Répertoire des Enseignants & Filières</div>
                </div>
            </div>
            
            <div class="stats-row">
                <div class="sbox">
                    <div class="slbl">Professeurs</div>
                    <div class="sval" id="stat-prof">—</div>
                </div>
                <div class="sbox">
                    <div class="slbl">Matières</div>
                    <div class="sval a" id="stat-mat">—</div>
                </div>
                <div class="sbox">
                    <div class="slbl">Filières</div>
                    <div class="sval g" id="stat-fil">—</div>
                </div>
                <button class="btn-navy" onclick="window.location.href='/'">← Rapport</button>
            </div>
        </header>

        <!-- Search & Control -->
        <div class="ctrl justify-between">
            <div class="flex gap-4 items-center">
                <div class="tg" id="view-tabs">
                    <button class="tab on" data-view="filieres">Filières</button>
                    <button class="tab" data-view="matieres">Matières</button>
                    <button class="tab" data-view="professeurs">Professeurs</button>
                    <button class="tab" data-view="relations">Graphe</button>
                </div>
                <div class="dvdr"></div>
                <!-- Filter Toggle -->
                <button class="btn-navy !bg-surface2 !text-navy border border-border" onclick="toggleSidebar()">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon>
                    </svg>
                    Filtrer
                </button>
            </div>
            
            <div class="flex items-center gap-3">
                <div id="results-count" class="text-[10px] font-bold text-text3 uppercase tracking-widest mr-2">0 Résultats</div>
                <input type="text" id="search" class="srch" placeholder="Rechercher..." />
            </div>
        </div>

        <div class="page-wrapper">
            <!-- Sidebar -->
            <aside id="filter-sidebar" class="filter-sidebar">
                <div class="flex justify-between items-center mb-8 lg:hidden">
                    <h2 class="font-bold text-navy">Filtres</h2>
                    <button onclick="toggleSidebar()" class="text-text3">&times;</button>
                </div>

                <div id="filter-groups-container">
                    <!-- Categories will be injected here -->
                    <div class="text-center py-8 text-text3 italic text-xs">Chargement des filtres...</div>
                </div>

                <button class="w-full btn-navy mt-6 !justify-center" onclick="resetFilters()">Réinitialiser</button>
            </aside>

            <!-- Content Area -->
            <main class="main-content">
                <div id="loading" class="card py-12 text-center">
                    <div class="inline-block animate-spin rounded-full h-8 w-8 border-b-2 border-navy mb-4"></div>
                    <p class="text-text3 italic">Préparation du répertoire académique...</p>
                </div>
                <div id="content"></div>
            </main>
        </div>
    </div>

    <!-- Enhanced Modal -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <div class="modal-header-sticky">
                <h2 id="modal-title" class="modal-title-text">Détails</h2>
                <button onclick="closeModal()" class="close-btn" title="Fermer">
                    &times;
                </button>
            </div>
            <div id="modal-content" class="modal-body">
                <!-- Dynamically populated -->
            </div>
        </div>
    </div>

    <script>
        let data = { professors: [], matieres: [], filieres: [], distribution: null };
        let currentView = 'filieres';
        let searchTerm = '';
        let selectedFilters = {
            annee: [],
            filiere: [],
            grade: [],
            status: []
        };
        let sortBy = 'name';
        let sortDir = 'asc';
        let page = 1;
        let pageSize = 20;

        // Load data
        async function loadData() {
            try {
                const [profResp, matResp, filResp] = await Promise.all([
                    fetch('/api/professors'),
                    fetch('/api/matieres'),
                    fetch('/api/filieres')
                ]);
                data.professors = profResp.ok ? (await profResp.json()).professors || [] : [];
                data.matieres = matResp.ok ? (await matResp.json()).matieres || [] : [];
                const filieresData = filResp.ok ? (await filResp.json()).filieres || [] : [];

                const storedDist = localStorage.getItem('or_google_selected_distribution');
                if (storedDist) {
                    data.distribution = JSON.parse(storedDist);
                    showDistributionContext();
                }

                data.filieres = filieresData.map(f => ({
                    ...f,
                    matieres: data.matieres.filter(m => m.filiere_id === f.id),
                    professeurs: [...new Set(data.matieres.filter(m => m.filiere_id === f.id).map(m => m.professeur))]
                }));

                updateStats();
                renderFilters();
                renderView();
            } catch (e) {
                console.error('Erreur:', e);
                document.getElementById('loading').innerHTML = '<p class="text-red-400">Erreur de chargement.</p>';
            }
        }

        function toggleSidebar() {
            const wrapper = document.querySelector('.page-wrapper');
            const sidebar = document.getElementById('filter-sidebar');
            
            if (window.innerWidth <= 1024) {
                sidebar.classList.toggle('open');
            } else {
                wrapper.classList.toggle('sidebar-collapsed');
            }
        }

        function resetFilters() {
            selectedFilters = { annee: [], filiere: [], grade: [], status: [] };
            searchTerm = '';
            document.getElementById('search').value = '';
            renderFilters();
            renderView();
        }

        function toggleFilter(category, value) {
            const arr = selectedFilters[category];
            const index = arr.indexOf(value);
            if (index > -1) arr.splice(index, 1);
            else arr.push(value);
            
            page = 1;
            renderFilters();
            renderView();
        }

        function getFilteredData() {
            if (currentView === 'filieres' || currentView === 'relations') {
                return data.filieres.filter(f => {
                    const matchesSearch = !searchTerm || f.nom.toLowerCase().includes(searchTerm.toLowerCase()) || f.abrevation.toLowerCase().includes(searchTerm.toLowerCase());
                    const matchesAnnee = selectedFilters.annee.length === 0 || selectedFilters.annee.includes(f.annee);
                    const matchesSpec = selectedFilters.filiere.length === 0 || selectedFilters.filiere.includes(f.nom);
                    return matchesSearch && matchesAnnee && matchesSpec;
                });
            } else if (currentView === 'professeurs') {
                return data.professors.filter(p => {
                    const matchesSearch = !searchTerm || p.full_name.toLowerCase().includes(searchTerm.toLowerCase());
                    const matchesGrade = selectedFilters.grade.length === 0 || selectedFilters.grade.includes(p.grade);
                    const matchesStatus = selectedFilters.status.length === 0 || selectedFilters.status.includes(p.status ? 'Actif' : 'Inactif');
                    
                    let matchesSpec = true;
                    if (selectedFilters.filiere.length > 0) {
                        const profMatieres = data.matieres.filter(m => m.id_professeur === p.id);
                        matchesSpec = profMatieres.some(m => selectedFilters.filiere.includes(m.filiere));
                    }
                    return matchesSearch && matchesGrade && matchesStatus && matchesSpec;
                });
            } else if (currentView === 'matieres') {
                return data.matieres.filter(m => {
                    const matchesSearch = !searchTerm || m.nom.toLowerCase().includes(searchTerm.toLowerCase());
                    const matchesAnnee = selectedFilters.annee.length === 0 || selectedFilters.annee.includes(m.filiere_annee);
                    const matchesSpec = selectedFilters.filiere.length === 0 || selectedFilters.filiere.includes(m.filiere);
                    return matchesSearch && matchesAnnee && matchesSpec;
                });
            }
            return [];
        }

        function renderFilters() {
            const container = document.getElementById('filter-groups-container');
            container.innerHTML = '';

            const groups = [];

            if (currentView === 'filieres' || currentView === 'relations' || currentView === 'matieres') {
                groups.push({
                    id: 'annee',
                    title: 'Niveau d\'Études',
                    options: [...new Set(data.filieres.map(f => f.annee))].sort().map(a => ({
                        label: a.replace('_', ' '),
                        value: a,
                        count: currentView === 'matieres' ? data.matieres.filter(m => m.filiere_annee === a).length : data.filieres.filter(f => f.annee === a).length
                    }))
                });
                groups.push({
                    id: 'filiere',
                    title: 'Spécialité Académique',
                    options: [...new Set(data.filieres.map(f => f.nom))].sort().map(nom => ({
                        label: nom,
                        value: nom,
                        count: currentView === 'matieres' ? data.matieres.filter(m => m.filiere === nom).length : data.filieres.filter(f => f.nom === nom).length
                    }))
                });
            }

            if (currentView === 'professeurs') {
                groups.push({
                    id: 'filiere',
                    title: 'Filtrer par Filière',
                    options: [...new Set(data.filieres.map(f => f.nom))].sort().map(nom => ({
                        label: nom,
                        value: nom,
                        count: data.professors.filter(p => {
                            const profMatieres = data.matieres.filter(m => m.id_professeur === p.id);
                            return profMatieres.some(m => m.filiere === nom);
                        }).length
                    }))
                });
                groups.push({
                    id: 'grade',
                    title: 'Grade Académique',
                    options: [...new Set(data.professors.map(p => p.grade).filter(Boolean))].sort().map(g => ({
                        label: g,
                        value: g,
                        count: data.professors.filter(p => p.grade === g).length
                    }))
                });
                groups.push({
                    id: 'status',
                    title: 'Statut de Disponibilité',
                    options: [
                        { label: 'Actif', value: 'Actif', count: data.professors.filter(p => p.status).length },
                        { label: 'Inactif', value: 'Inactif', count: data.professors.filter(p => !p.status).length }
                    ]
                });
            }

            groups.forEach(group => {
                const groupDiv = document.createElement('div');
                groupDiv.className = 'filter-group';
                
                let optionsHtml = group.options.map(opt => `
                    <div class="filter-option ${selectedFilters[group.id].includes(opt.value) ? 'active' : ''}" 
                         onclick="toggleFilter('${group.id}', '${opt.value}')">
                        <div class="cb-container"><div class="cb-mark"></div></div>
                        <span>${opt.label}</span>
                        <span class="count-pill">(${opt.count})</span>
                    </div>
                `).join('');

                groupDiv.innerHTML = `
                    <div class="filter-title">
                        ${group.title}
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
                            <path d="M6 9l6 6 6-6"></path>
                        </svg>
                    </div>
                    <div class="filter-options">${optionsHtml}</div>
                `;
                container.appendChild(groupDiv);
            });
        }

        function getGradeBadgeClass(grade) {
            if (!grade) return 'grade-default';
            const g = grade.toLowerCase();
            if (g.includes('prof') || g.includes('conf')) return 'grade-prof';
            if (g.includes('maitre')) return 'grade-maitre';
            if (g.includes('assistant')) return 'grade-assistant';
            return 'grade-default';
        }

        function getChargeClass(charge) {
            if (!charge || charge === 0) return 'charge-0';
            if (charge <= 5) return 'charge-low';
            if (charge <= 10) return 'charge-mid';
            return 'charge-high';
        }

        function showDistributionContext() {
            const context = document.getElementById('distribution-context');
            if (!context) return;
            
            const name = document.getElementById('active-dist-name');
            const meta = document.getElementById('active-dist-meta');
            
            if (data.distribution) {
                context.classList.remove('hidden');
                if (name) name.textContent = `Bloc ${data.distribution.bloc === 'matin' ? 'Matin' : 'Après-midi'}`;
                const date = new Date(data.distribution.timestamp).toLocaleString();
                if (meta) meta.textContent = `Généré le ${date}`;
            }
        }

        function clearDistribution() {
            localStorage.removeItem('or_google_selected_distribution');
            data.distribution = null;
            const context = document.getElementById('distribution-context');
            if (context) context.classList.add('hidden');

            } else if (currentView === 'matieres') {

        function renderRelations(container, filtered) {
            container.innerHTML = `
                <div id="graph-container" class="w-full h-[600px]">
                    <div class="graph-legend">
                        <div class="legend-item"><span class="legend-dot" style="background:#1B3A6B"></span> Professeurs</div>
                        <div class="legend-item"><span class="legend-dot" style="background:#2D6A4F"></span> Matières</div>
                        <div class="legend-item"><span class="legend-dot" style="background:#C67C0D"></span> Filières</div>
                    </div>
                    <div id="graph-tooltip" class="tooltip"></div>
                </div>
                <div class="flex justify-between items-center mt-6">
                    <p class="text-xs text-text3 font-medium uppercase tracking-widest">Graphe Interactif des Relations Académiques</p>
                    <button class="tab !py-1 !px-4 border border-border" onclick="renderView()">Réinitialiser la Vue</button>
                </div>
            `;
            
            setTimeout(() => {
                const el = document.getElementById('graph-container');
                if (!el) return;
                const width = el.clientWidth;
                const height = 600;
                const tooltip = d3.select('#graph-tooltip');

                const svg = d3.select('#graph-container')
                    .append('svg')
                    .attr('width', '100%')
                    .attr('height', '100%')
                    .attr('viewBox', [0, 0, width, height]);

                const g = svg.append('g');

                svg.call(d3.zoom().on('zoom', (event) => {
                    g.attr('transform', event.transform);
                }));

                const nodes = [];
                const links = [];
                const nodeMap = new Map();

                // Build graph from FILTERED filieres
                filtered.forEach(f => {
                    const filId = 'f' + f.id;
                    if (!nodeMap.has(filId)) {
                        nodes.push({ id: filId, name: f.abrevation, type: 'filiere' });
                        nodeMap.set(filId, true);
                    }

                    f.matieres.forEach(m => {
                        const matId = 'm' + m.id;
                        if (!nodeMap.has(matId)) {
                            nodes.push({ id: matId, name: m.nom, type: 'matiere' });
                            nodeMap.set(matId, true);
                        }
                        links.push({ source: filId, target: matId });

                        if (m.id_professeur) {
                            const profId = 'p' + m.id_professeur;
                            if (!nodeMap.has(profId)) {
                                nodes.push({ id: profId, name: m.professeur, type: 'prof' });
                                nodeMap.set(profId, true);
                            }
                            links.push({ source: matId, target: profId });
                        }
                    });
                });

                if (nodes.length === 0) {
                    el.innerHTML = '<div class="h-full flex items-center justify-center text-text3 italic">Aucun node à afficher pour ces filtres.</div>';
                    return;
                }

                const simulation = d3.forceSimulation(nodes)
                    .force('link', d3.forceLink(links).id(d => d.id).distance(100))
                    .force('charge', d3.forceManyBody().strength(-400))
                    .force('center', d3.forceCenter(width / 2, height / 2))
                    .force('collide', d3.forceCollide(30));

                const link = g.append('g')
                    .attr('stroke', '#E2DDD5')
                    .attr('stroke-opacity', 0.8)
                    .selectAll('line')
                    .data(links)
                    .join('line')
                    .attr('stroke-width', 2);

                const nodeGroup = g.append('g')
                    .selectAll('g')
                    .data(nodes)
                    .join('g')
                    .on('mouseover', (event, d) => {
                        tooltip.style('opacity', 1).html(`<strong>${d.name}</strong><br>${d.type.toUpperCase()}`);
                    })
                    .on('mousemove', (event) => {
                        tooltip.style('left', (event.offsetX + 15) + 'px').style('top', (event.offsetY - 15) + 'px');
                    })
                    .on('mouseout', () => tooltip.style('opacity', 0))
                    .call(d3.drag()
                        .on('start', (event, d) => {
                            if (!event.active) simulation.alphaTarget(0.3).restart();
                            d.fx = d.x; d.fy = d.y;
                        })
                        .on('drag', (event, d) => {
                            d.fx = event.x; d.fy = event.y;
                        })
                        .on('end', (event, d) => {
                            if (!event.active) simulation.alphaTarget(0);
                            d.fx = null; d.fy = null;
                        }));

                nodeGroup.append('circle')
                    .attr('r', d => d.type === 'prof' ? 12 : (d.type === 'filiere' ? 15 : 8))
                    .attr('fill', d => {
                        if (d.type === 'prof') return '#1B3A6B';
                        if (d.type === 'matiere') return '#2D6A4F';
                        return '#C67C0D';
                    })
                    .attr('stroke', '#fff')
                    .attr('stroke-width', 2);

                nodeGroup.append('text')
                    .attr('dy', 25)
                    .attr('text-anchor', 'middle')
                    .attr('font-size', '10px')
                    .attr('font-weight', '700')
                    .attr('fill', '#4A453E')
                    .text(d => d.name);

                simulation.on('tick', () => {
                    link.attr('x1', d => d.source.x).attr('y1', d => d.source.y).attr('x2', d => d.target.x).attr('y2', d => d.target.y);
                    nodeGroup.attr('transform', d => `translate(${d.x},${d.y})`);
                });
            }, 100);
        }

                        <div>
                            <h3 class="text-lg font-bold text-navy uppercase tracking-widest">Semestre 2</h3>
                            <p class="text-[10px] text-text3 font-bold uppercase">${sem2.length} matières</p>
                        </div>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        ${sem2.length > 0 ? sem2.map(m => {
                            const hasEval = m.ds || m.examen;
                            return `
                                <div class="subject-card border-l-4 ${m.examen ? 'border-navy' : (m.ds ? 'border-amber' : (hasEval ? 'border-border' : 'border-red'))} ${!hasEval ? 'opacity-90' : ''}">
                                    <div class="flex justify-between items-start mb-2 gap-2">
                                        <div class="text-sm font-bold ${!hasEval ? 'text-red' : 'text-navy'} leading-tight">${m.nom}</div>
                                        <div class="flex gap-1 flex-shrink-0">
                                            ${m.ds ? '<span class="type-badge type-ds">DS</span>' : ''}
                                            ${m.examen ? '<span class="type-badge type-examen">EXAMEN</span>' : ''}
                                            ${!hasEval ? '<span class="type-badge type-none">AUCUNE ÉVAL.</span>' : ''}
                                        </div>
                                    </div>
                                    <div class="text-[10px] text-text3 font-medium uppercase tracking-tight">${m.professeur || 'Non assigné'}</div>
                                </div>
                            `;
                        }).join('') : '<div class="col-span-2 py-6 text-center text-text3 italic text-xs">Aucune matière pour le S2</div>'}
                    </div>
                </div>

                <div>
                    <h3 class="text-sm font-bold text-navy uppercase tracking-widest mb-4">Intervenants</h3>
                    <div class="flex flex-wrap gap-2">
                        ${fil.professeurs.map(p => `
                            <span class="bg-surface2 border border-border px-3 py-1.5 rounded-lg text-xs font-medium text-text2">${p}</span>
                        `).join('')}
                    </div>
                </div>
            `;
            document.getElementById('modal').style.display = 'flex';
        }

        function showProfDetails(id) {
            const prof = data.professors.find(p => p.id === id);
            const matieres = data.matieres.filter(m => m.id_professeur === id);
            document.getElementById('modal-title').textContent = `Détails Professeur`;
            document.getElementById('modal-content').innerHTML = `
                <div class="mb-10 grid grid-cols-3 gap-4">
                    <div class="bg-surface2 p-4 rounded-xl border border-border text-center">
                        <div class="eyebrow">Grade</div>
                        <div class="text-sm font-bold text-navy">${prof.grade || 'N/A'}</div>
                    </div>
                    <div class="bg-surface2 p-4 rounded-xl border border-border text-center">
                        <div class="eyebrow">Charge</div>
                        <div class="text-sm font-bold text-amber">${prof.charge || 0}h</div>
                    </div>
                    <div class="bg-surface2 p-4 rounded-xl border border-border text-center">
                        <div class="eyebrow">Status</div>
                        <div class="text-xs font-bold text-green uppercase">En service</div>
                    </div>
                </div>
                
                <h3 class="text-lg font-serif text-navy mb-4">${prof.full_name}</h3>
                <div class="space-y-3">
                    ${matieres.map(m => {
                        const hasEval = m.ds || m.examen;
                        return `
                        <div class="subject-card border-l-4 ${m.examen ? 'border-navy' : (m.ds ? 'border-amber' : (hasEval ? 'border-border' : 'border-red'))} flex justify-between items-center ${!hasEval ? 'opacity-90' : ''}">
                            <div>
                                <div class="text-sm font-bold ${!hasEval ? 'text-red' : 'text-navy'}">${m.nom}</div>
                                <div class="text-[10px] text-text3 font-bold uppercase">${m.filiere}</div>
                            </div>
                            <div class="flex gap-1">
                                ${m.ds ? '<span class="type-badge type-ds">DS</span>' : ''}
                                ${m.examen ? '<span class="type-badge type-examen text-[8px]">EXAMEN</span>' : ''}
                                ${!hasEval ? '<span class="type-badge type-none">AUCUNE ÉVAL.</span>' : ''}
                            </div>
                        </div>
                    `;}).join('')}
                </div>
            `;
            document.getElementById('modal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('modal').style.display = 'none';
        }

        // Tabs
        document.querySelectorAll('.tab').forEach(t => {
            t.addEventListener('click', () => {
                document.querySelectorAll('.tab').forEach(x => x.classList.remove('on'));
                t.classList.add('on');
                currentView = t.dataset.view;
                renderFilters();
                renderView();
            });
        });

        document.getElementById('search').addEventListener('input', (e) => {
            searchTerm = e.target.value;
            renderView();
        });

        // Init
        loadData();
    </script>
</body>
</html>
