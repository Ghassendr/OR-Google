<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>ISSAT Sousse - Répertoire Académique</title>
    <link rel="icon" type="image/jpeg" href="/logo%20issat-small.jpg">
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="/sidebar-component.css">
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        @media print {

            .side-nav,
            .top-hdr,
            .no-print,
            .filters-bar,
            #btn-actions {
                display: none !important;
            }

            .main-content {
                padding: 0 !important;
                margin: 0 !important;
                width: 100% !important;
            }

            .card {
                box-shadow: none !important;
                border: 1px solid #ddd !important;
            }

            body {
                background: white !important;
            }

            .timetable-header {
                display: block !important;
            }
        }

        .timetable-header {
            display: none;
        }

        @media screen {
            .timetable-header {
                display: none;
            }
        }

        :root {
            --bg:        #EEF2F7;
            --surface:   #FFFFFF;
            --surface2:  #F4F7FB;
            --border:    #DDE3ED;
            --border2:   #C5CFDF;
            --navy:      #13213A;
            --navy2:     #1A2D4F;
            --accent:    #38BDBE;
            --accent-lt: rgba(56, 189, 190, 0.1);
            --amber:     #E8960A;
            --amber-lt:  #FEF3C7;
            --green:     #059669;
            --green-lt:  #D1FAE5;
            --red:       #DC2626;
            --red-lt:    #FEE2E2;
            --text:      #0F1A2E;
            --text2:     #2D405A;
            --text3:     #6B7E97;
            --sh:        0 1px 4px rgba(0,0,0,0.07), 0 1px 2px rgba(0,0,0,0.05);
            --sh2:       0 4px 16px rgba(0,0,0,0.09), 0 2px 6px rgba(0,0,0,0.06);
            --hdr-bg:    #13213A;
        }

        :root.dark-mode {
            --bg:        #0B1220;
            --surface:   #131F35;
            --surface2:  #1C2C46;
            --border:    #243351;
            --border2:   #2E4368;
            --navy:      #38BDBE;
            --navy2:     #6DD5D6;
            --accent:    #38BDBE;
            --accent-lt: rgba(56, 189, 190, 0.12);
            --amber:     #FBBF24;
            --amber-lt:  rgba(251, 191, 36, 0.1);
            --green:     #34D399;
            --green-lt:  rgba(52, 211, 153, 0.1);
            --red:       #F87171;
            --red-lt:    rgba(248, 113, 113, 0.1);
            --text:      #E2EAF4;
            --text2:     #A8BECE;
            --text3:     #6B7E97;
            --sh:        0 4px 16px rgba(0,0,0,0.35);
            --sh2:       0 8px 32px rgba(0,0,0,0.45);
            --hdr-bg:    #0B1220;
        }

        .dark-mode .hdr {
            background: var(--hdr-bg);
            border: 1px solid var(--border);
        }

        .dark-mode .sbox {
            background: rgba(255, 255, 255, .05);
        }

        .dark-mode .tg,
        .dark-mode .srch {
            background: var(--surface2);
        }

        .dark-mode .tab.on {
            background: var(--navy);
            color: #000;
            font-weight: 800;
        }

        .dark-mode img {
            filter: brightness(0.9);
        }

        .dark-mode .subject-card {
            border-color: var(--border);
        }

        .dark-mode .close-btn {
            background: var(--border);
            color: var(--text);
        }

        .dark-mode .badge-grade.grade-prof {
            background: rgba(96, 165, 250, 0.2);
            color: #93C5FD;
        }

        .dark-mode .badge-grade.grade-maitre {
            background: rgba(251, 191, 36, 0.2);
            color: #FCD34D;
        }

        .mode-toggle {
            cursor: pointer;
            width: 42px;
            height: 42px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: absolute;
            top: 24px;
            right: 24px;
            z-index: 100;
            backdrop-filter: blur(8px);
        }

        .mode-toggle:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.05);
        }

        .dark-mode .mode-toggle {
            background: #FBBF24;
            color: #000;
            border-color: transparent;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0
        }

        html {
            scroll-behavior: smooth
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
            font-size: 14px;
            line-height: 1.5;
            overflow-x: hidden;
        }

        /* Main wrapper shifts with sidebar */
        .main-wrapper {
            margin-left: 256px;
            padding: 28px 32px;
            transition: margin-left 0.30s cubic-bezier(0.4, 0, 0.2, 1);
            min-height: 100vh;
        }

        body.sidebar-collapsed .main-wrapper {
            margin-left: 64px;
        }

        @media (max-width: 900px) {
            .main-wrapper {
                margin-left: 0 !important;
                padding: 16px;
            }
        }

        /* ── Stats Banner (page header) ─────────────────── */
        .stats-banner {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 0;
            margin-bottom: 20px;
            box-shadow: var(--sh);
            overflow: hidden;
        }

        .stats-banner::before {
            content: '';
            display: block;
            height: 4px;
            background: linear-gradient(90deg, var(--accent) 0%, #2A9494 50%, var(--navy) 100%);
            border-radius: 14px 14px 0 0;
        }

        .stats-banner-inner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 22px;
            gap: 16px;
            flex-wrap: wrap;
        }

        .stats-banner-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .stats-banner-left img {
            width: 40px;
            height: 40px;
            border-radius: 9px;
            object-fit: cover;
            border: 1px solid var(--border);
        }

        .stats-banner-title .eyebrow {
            font-size: 9.5px;
            letter-spacing: 2px;
            color: var(--accent);
            text-transform: uppercase;
            font-weight: 700;
            margin-bottom: 2px;
        }

        .stats-banner-title h1 {
            font-family: 'DM Serif Display', serif;
            font-size: 20px;
            color: var(--navy);
            line-height: 1.2;
        }

        .stats-row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
        }

        .sbox {
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 9px;
            padding: 9px 14px;
            min-width: 85px;
            transition: border-color 0.2s;
        }

        .sbox:hover { border-color: var(--accent); }

        .slbl {
            font-size: 9px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--text3);
            font-weight: 700;
            margin-bottom: 3px;
        }

        .sval {
            font-family: 'DM Serif Display', serif;
            font-size: 20px;
            color: var(--navy);
        }

        .sval.a { color: var(--amber); }
        .sval.g { color: var(--green); }

        /* Profile Edit Modal Styles */
        .prof-modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(6px);
            z-index: 2000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .prof-modal-overlay.open {
            display: flex;
        }

        .prof-modal {
            background: var(--surface);
            border-radius: 20px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border);
            animation: slideUp 0.28s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(16px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .prof-modal-hdr {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 22px 28px 18px;
            border-bottom: 1px solid var(--border);
        }

        .prof-modal-hdr h2 {
            font-family: 'DM Serif Display', serif;
            font-size: 22px;
            color: var(--navy);
        }

        .prof-modal-close {
            background: var(--surface2);
            border: 1px solid var(--border);
            cursor: pointer;
            color: var(--text3);
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .prof-modal-close:hover {
            background: var(--red-lt);
            color: var(--red);
            border-color: rgba(220, 38, 38, 0.2);
        }

        .prof-modal-body {
            padding: 24px 28px 28px;
        }

        .prof-field {
            margin-bottom: 16px;
        }

        .prof-field label {
            display: block;
            font-size: 11px;
            font-weight: 700;
            color: var(--text2);
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 6px;
        }

        .prof-field input {
            width: 100%;
            border: 1.5px solid var(--border);
            border-radius: 9px;
            background: var(--surface2);
            padding: 10px 14px;
            font-family: 'DM Sans', sans-serif;
            font-size: 13px;
            color: var(--text);
            outline: none;
            transition: all 0.18s;
        }

        .prof-field input:focus {
            border-color: var(--navy2);
            background: #fff;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        .prof-submit-btn {
            width: 100%;
            background: var(--navy);
            color: white;
            border: none;
            border-radius: 10px;
            padding: 12px;
            font-family: 'DM Sans', sans-serif;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 8px;
        }

        .prof-submit-btn:hover {
            filter: brightness(1.1);
            transform: translateY(-1px);
        }

        /* DS/Examen inline toggles */
        .ds-toggle-wrap {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            user-select: none;
        }

        .ds-pill {
            font-size: 10px;
            font-weight: 800;
            padding: 3px 10px;
            border-radius: 20px;
            border: 1.5px solid;
            transition: all 0.2s;
            cursor: pointer;
        }

        .ds-pill.ds-on {
            background: var(--amber-lt);
            color: var(--amber);
            border-color: rgba(217, 119, 6, 0.3);
        }

        .ds-pill.ds-off {
            background: var(--surface2);
            color: var(--text3);
            border-color: var(--border);
        }

        .ds-pill.ex-on {
            background: var(--green-lt);
            color: var(--green);
            border-color: rgba(5, 150, 105, 0.3);
        }

        .ds-pill.ex-off {
            background: var(--surface2);
            color: var(--text3);
            border-color: var(--border);
        }

        .ds-pill:hover {
            opacity: 0.75;
        }

        .w {
            max-width: 1400px;
            margin: 0 auto;
            padding: 28px 24px
        }

        .hdr {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 0;
            margin-bottom: 22px;
            box-shadow: var(--sh);
            overflow: hidden;
        }

        .hdr::before {
            content: '';
            display: block;
            height: 4px;
            background: linear-gradient(90deg, var(--accent) 0%, #2A9494 50%, var(--navy) 100%);
            border-radius: 14px 14px 0 0;
        }

        .hdr-inner {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            align-items: center;
            justify-content: space-between;
            padding: 18px 26px;
        }

        .hdr-title {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .eyebrow {
            font-size: 9.5px;
            letter-spacing: 2.5px;
            color: var(--accent);
            text-transform: uppercase;
            font-weight: 700;
            margin-bottom: 2px;
        }

        .hdr h1 {
            font-family: 'DM Serif Display', serif;
            font-size: 26px;
            color: var(--navy);
            line-height: 1.1;
            margin-bottom: 4px;
        }

        .hdr-sub {
            font-size: 12px;
            color: var(--text3);
        }

        /* Header Quick Actions */
        .hdr-actions {
            display: flex;
            gap: 8px;
            align-items: center;
            margin-left: 14px;
            border-left: 1px solid var(--border);
            padding-left: 14px;
        }

        .hdr-btn {
            background: var(--navy);
            border: 1px solid var(--navy);
            color: #fff;
            border-radius: 8px;
            padding: 9px 16px;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 7px;
            font-family: 'DM Sans', sans-serif;
            white-space: nowrap;
        }

        .hdr-btn:hover {
            background: var(--accent);
            border-color: var(--accent);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(56, 189, 190, 0.25);
        }

        .hdr-icon-btn {
            background: var(--surface2);
            border: 1px solid var(--border);
            color: var(--text2);
            border-radius: 8px;
            width: 38px;
            height: 38px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .hdr-icon-btn:hover {
            background: var(--accent-lt);
            border-color: var(--accent);
            color: var(--accent);
            transform: translateY(-1px);
        }

        .ctrl {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px 20px;
            margin-bottom: 16px;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
            box-shadow: var(--sh)
        }

        .tg {
            display: flex;
            gap: 4px;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 4px
        }

        .tab {
            padding: 7px 18px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-family: 'DM Sans', sans-serif;
            font-size: 13px;
            font-weight: 600;
            transition: all .2s;
            color: var(--text3);
            background: transparent
        }

        .tab.on {
            background: var(--navy);
            color: #fff;
            box-shadow: 0 2px 8px rgba(27, 58, 107, .3)
        }

        .tab:hover:not(.on) {
            background: var(--border);
            color: var(--text2)
        }

        .srch {
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 8px 12px;
            font-family: 'DM Sans', sans-serif;
            font-size: 13px;
            color: var(--text);
            background: var(--surface2);
            outline: none;
            width: 220px;
            transition: border .2s
        }

        .srch:focus {
            border-color: var(--navy2);
            background: #fff
        }

        .btn-navy {
            background: var(--navy);
            color: #fff;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            text-decoration: none;
            transition: transform 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-navy:hover {
            transform: translateY(-1px);
            filter: brightness(1.1);
        }

        /* Sidebar Filter System */
        .page-wrapper {
            display: flex;
            gap: 24px;
            margin-top: 24px;
            min-height: 80vh;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .filter-sidebar {
            width: 280px;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            height: fit-content;
            position: sticky;
            top: 24px;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            opacity: 1;
            transform-origin: left;
            overflow: hidden;
        }

        /* Hidden State - Desktop (independent from nav sidebar) */
        .page-wrapper.filter-collapsed .filter-sidebar {
            width: 0;
            padding: 0;
            border: none;
            margin-right: -24px;
            opacity: 0;
            pointer-events: none;
            transform: translateX(-20px);
        }

        .filter-group {
            margin-bottom: 24px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 16px;
        }

        .filter-group:last-child {
            border-bottom: none;
        }

        .filter-title {
            font-family: 'DM Sans', sans-serif;
            font-size: 14px;
            font-weight: 700;
            color: var(--navy);
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            user-select: none;
        }

        .filter-title svg {
            transition: transform 0.3s ease;
        }

        .filter-group.collapsed .filter-title svg {
            transform: rotate(-90deg);
        }

        .filter-group.collapsed .filter-options {
            display: none;
        }

        .filter-options {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .filter-option {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            font-size: 13px;
            color: var(--text2);
            transition: color 0.2s;
        }

        .filter-option:hover {
            color: var(--navy);
        }

        /* Custom Checkbox */
        .cb-container {
            width: 18px;
            height: 18px;
            border: 2px solid var(--border);
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            flex-shrink: 0;
            background: #fff;
        }

        .filter-option.active .cb-container {
            background: var(--navy);
            border-color: var(--navy);
        }

        .cb-mark {
            width: 8px;
            height: 4px;
            border-left: 2px solid #fff;
            border-bottom: 2px solid #fff;
            transform: rotate(-45deg) translateY(-1px);
            opacity: 0;
        }

        .filter-option.active .cb-mark {
            opacity: 1;
        }

        .count-pill {
            margin-left: auto;
            font-size: 11px;
            font-weight: 500;
            color: var(--text3);
            opacity: 0.6;
        }

        .main-content {
            flex-grow: 1;
            min-width: 0;
        }

        /* Mobile Adjustments */
        @media (max-width: 1024px) {
            .page-wrapper {
                flex-direction: column;
            }

            .filter-sidebar {
                width: 100%;
                position: fixed;
                top: 0;
                left: 0;
                right: 0;
                bottom: 0;
                z-index: 2000;
                transform: translateX(-100%);
                border-radius: 0;
            }

            .filter-sidebar.open {
                transform: translateX(0);
            }
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            box-shadow: var(--sh);
            transition: all 0.3s ease;
        }

        .card:hover {
            box-shadow: var(--sh2);
            border-color: var(--border2);
            transform: translateY(-2px);
        }

        .badge {
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 4px 10px;
            border-radius: 6px;
        }

        .badge-navy {
            background: var(--amber-lt);
            color: var(--amber);
        }

        /* Table Styling */
        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
        }

        th {
            background: var(--surface2);
            padding: 14px 16px;
            text-align: left;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text3);
            border-bottom: 2px solid var(--border);
            cursor: pointer;
            transition: background 0.2s;
        }

        th:hover {
            background: var(--border);
            color: var(--navy);
        }

        td {
            padding: 16px;
            border-bottom: 1px solid var(--border);
            font-size: 13px;
            color: var(--text2);
            transition: background 0.2s;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover td {
            background: rgba(198, 124, 13, 0.03);
            /* Subtle Amber hover */
        }

        /* Status & Grade Badges */
        .badge-status {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .status-on {
            background: #ECFDF5;
            color: #059669;
        }

        .status-off {
            background: #FEF2F2;
            color: #DC2626;
        }

        .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            display: inline-block;
        }

        .dot-on {
            background: #10B981;
        }

        .dot-off {
            background: #EF4444;
        }

        .badge-grade {
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 10px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .grade-prof {

        /* Graph Container */

<body>
    <div id="sidebar-container"></div>

    <div class="main-wrapper" id="main-wrapper">
        <div class="stats-banner">
            <div class="stats-banner-inner">
                <div class="stats-banner-left">
                    <img src="/logo%20issat-small.jpg" alt="Logo">
                    <div class="stats-banner-title">
                        <div class="flex items-center gap-3">
                            <div class="eyebrow">Répertoire Académique — ISSAT Sousse</div>
                            <div id="status-badge" class="hidden px-2 py-0.5 bg-green-100 text-green-700 text-[9px] font-black uppercase tracking-widest rounded-full border border-green-200">
                                Officiel
                            </div>
                        </div>
                        <h1>Explorateur Académique</h1>
                    </div>
                </div>
                <div class="stats-row">
                    <div class="sbox">
                        <div class="slbl">Professeurs</div>
                        <div class="sval" id="stat-prof">—</div>
                    </div>
                    <div class="sbox">
                        <div class="slbl">Matières</div>
                        <div class="sval a" id="stat-mat">—</div>
                    </div>
                    <div class="sbox">
                        <div class="slbl">Filières</div>
                        <div class="sval g" id="stat-fil">—</div>
                    </div>
                </div>
            </div>
        </div>

        <div
            style="display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px 18px;margin-bottom:22px;box-shadow:var(--sh);">
            <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"
                style="color:var(--text3);flex-shrink:0;">
                <circle cx="11" cy="11" r="8" />
                <path d="m21 21-4.35-4.35" />
            </svg>
            <input type="text" id="search" class="srch" placeholder="Rechercher filière, enseignant, matière..."
                style="border:none;background:transparent;outline:none;width:100%;font-size:14px;color:var(--text);font-weight:500;" />
            <div id="results-count"
                style="font-size:10px; font-weight:800; color:var(--text3); text-transform:uppercase; letter-spacing:1px; white-space:nowrap; border-left:1px solid var(--border); padding-left:15px">
                0 Résultats</div>
        </div>

        <div class="page-wrapper">
            <aside id="filter-sidebar" class="filter-sidebar">
                <div class="flex justify-between items-center mb-8 lg:hidden">
                    <h2 class="font-bold text-navy">Filtres</h2>
                    <button onclick="toggleFilterSidebar()" class="text-text3">&times;</button>
                </div>
                <div id="filter-groups-container">
                    <div class="text-center py-8 text-text3 italic text-xs">Chargement des filtres...</div>
                </div>
                <button class="w-full btn-navy mt-6 !justify-center" onclick="resetFilters()">Réinitialiser</button>
            </aside>

            <main class="main-content">
                <div id="loading" class="card py-12 text-center">
                    <div class="inline-block animate-spin rounded-full h-8 w-8 border-b-2 border-navy mb-4"></div>
                    <p class="text-text3 italic">Préparation du répertoire académique...</p>
                </div>
                <div id="content"></div>
            </main>
        </div>
    </div>

    <!-- Enhanced Modal -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <div class="modal-header-sticky">
                <h2 id="modal-title" class="modal-title-text">Détails</h2>
                <button onclick="closeModal()" class="close-btn" title="Fermer">&times;</button>
            </div>
            <div id="modal-content" class="modal-body"></div>
        </div>
    </div>

    <!-- Profile Edit Modal -->
    <div class="prof-modal-overlay" id="profile-modal">
        <div class="prof-modal">
            <div class="prof-modal-hdr">
                <h2>Mon Profil</h2>
                <button class="prof-modal-close" onclick="closeProfileModal()">
                    <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor"
                        stroke-width="2.5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M18 6L6 18M6 6l12 12" />
                    </svg>
                </button>
            </div>
            <div class="prof-modal-body">
                <div id="profile-msg"
                    style="display:none;margin-bottom:12px;padding:10px 14px;border-radius:9px;font-size:12px;font-weight:700;">
                </div>
                <form id="profile-form" onsubmit="saveProfile(event)">
                    <div class="prof-field">
                        <label>Nom Complet</label>
                        <input type="text" id="prof-name-input" required placeholder="Ex: Dr. Ahmed Ben Ali">
                    </div>
                    <div class="prof-field">
                        <label>Grade / Titre</label>
                        <input type="text" id="prof-grade-input" placeholder="Ex: Maître de Conférences">
                    </div>
                    <div class="prof-field" id="admin-charge-field" style="display:none;">
                        <label>Charge de Surveillance</label>
                        <input type="number" id="prof-charge-input" placeholder="Ex: 4">
                    </div>
                    <button type="submit" class="prof-submit-btn" id="prof-save-btn">Sauvegarder</button>
                </form>
            </div>
        </div>
    </div>

    <script src="/sidebar-component.js"></script>
    <script>
        // ========================
        // SIDEBAR & AUTH
        // ========================
        let currentUser = null;

        async function checkAuth() {
            try {
                const resp = await fetch('/api/me'); if (!resp.ok) return;
                const d = await resp.json();
                if (d.logged_in && d.user) {
                    currentUser = d.user;
                }
            } catch (e) { console.warn('Auth check skipped', e); }
        }

        function toggleFilterSidebar() {
            const wrapper = document.querySelector('.page-wrapper');
            const sidebar = document.getElementById('filter-sidebar');
            if (window.innerWidth <= 1024) {
                sidebar.classList.toggle('open');
            } else {
                // Use .filter-collapsed on the page-wrapper, NOT body.sidebar-collapsed
                // so the nav sidebar toggle doesn't affect this
                wrapper.classList.toggle('filter-collapsed');
            }
        }

        function setView(v) {
            currentView = v;
            document.querySelectorAll('.nav-item').forEach(a => a.classList.remove('active'));
            const navEl = document.getElementById('nav-' + currentView);
            if (navEl) navEl.classList.add('active');
            page = 1;
            renderView();
            renderFilters();
        }

        // Profile Modal
        function openProfileModal() {
            if (!currentUser) return;
            const prof = data.professors.find(p => String(p.id) === String(currentUser.prof_id));
            document.getElementById('prof-name-input').value = currentUser.full_name || (prof ? prof.name : '') || '';
            document.getElementById('prof-grade-input').value = prof ? (prof.grade || '') : '';
            const chargeField = document.getElementById('admin-charge-field');
            if (chargeField) chargeField.style.display = currentUser.role === 'ADMIN' ? 'block' : 'none';
            if (currentUser.role === 'ADMIN' && prof) {
                document.getElementById('prof-charge-input').value = prof.charge_surv || 0;
            }
            document.getElementById('profile-msg').style.display = 'none';
            document.getElementById('profile-modal').classList.add('open');
        }

        function closeProfileModal() {
            document.getElementById('profile-modal').classList.remove('open');
        }

        async function saveProfile(e) {
            e.preventDefault();
            const btn = document.getElementById('prof-save-btn');
            btn.disabled = true; btn.textContent = 'Enregistrement...';
            const payload = {
                id: currentUser.prof_id || currentUser.id,
                full_name: document.getElementById('prof-name-input').value,
                grade: document.getElementById('prof-grade-input').value,
                charge: document.getElementById('prof-charge-input') ? document.getElementById('prof-charge-input').value : 0
            };
            try {
                const resp = await fetch('/api/professors/update', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const msg = document.getElementById('profile-msg');
                if (resp.ok) {
                    msg.textContent = '✓ Profil mis à jour avec succès !';
                    msg.style.display = 'block'; msg.style.background = 'var(--green-lt)'; msg.style.color = 'var(--green)';
                    currentUser.full_name = payload.full_name;
                    document.getElementById('user-display-name').textContent = payload.full_name;
                    setTimeout(closeProfileModal, 1800);
                } else {
                    msg.textContent = '✖ Erreur lors de la mise à jour.';
                    msg.style.display = 'block'; msg.style.background = 'var(--red-lt)'; msg.style.color = 'var(--red)';
                }
            } catch (err) {
                const msg = document.getElementById('profile-msg');
                msg.textContent = '✖ Erreur réseau.'; msg.style.display = 'block';
            } finally { btn.disabled = false; btn.textContent = 'Sauvegarder'; }
        }

        // Admin: Update professor charge de surveillance directly
        let chargeUpdateTimer = null;
        async function updateCharge(profId, newCharge) {
            clearTimeout(chargeUpdateTimer);
            chargeUpdateTimer = setTimeout(async () => {
                const prof = data.professors.find(p => p.id === profId);
                if (!prof) return;

                // Visual feedback: Start
                const inputs = document.querySelectorAll(`input[onchange*="updateCharge(${profId}"]`);
                inputs.forEach(inp => { inp.style.opacity = '0.5'; });

                try {
                    const resp = await fetch('/api/professors/update', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            id: profId,
                            full_name: prof.name || prof.full_name, // Prevent wipe by sending current name
                            grade: prof.grade || '',
                            charge: parseInt(newCharge) || 0
                        })
                    });
                    if (resp.ok) {
                        prof.charge = parseInt(newCharge) || 0;
                        // Brief visual feedback: Success
                        inputs.forEach(inp => {
                            inp.style.opacity = '1';
                            inp.style.borderColor = '#10B981';
                            inp.style.boxShadow = '0 0 0 3px rgba(16, 185, 129, 0.1)';
                            setTimeout(() => { inp.style.borderColor = ''; inp.style.boxShadow = ''; }, 1500);
                        });
                    } else {
                        inputs.forEach(inp => { inp.style.opacity = '1'; inp.style.borderColor = 'var(--red)'; });
                    }
                } catch (e) {
                    console.warn('updateCharge error', e);
                    inputs.forEach(inp => { inp.style.opacity = '1'; });
                }
            }, 600); // Debounce 600ms after typing stops
        }

        // DS/Examen Toggle
        async function toggleMatiereStatus(id, type) {
            const m = data.matieres.find(x => x.id === id);
            if (!m) return;
            const canEdit = !currentUser || currentUser.role === 'ADMIN' || String(m.id_professeur) === String(currentUser.prof_id);
            if (!canEdit) return;
            const newVal = !m[type];
            const payload = { id, ds: type === 'ds' ? newVal : m.ds, examen: type === 'examen' ? newVal : m.examen };
            try {
                const resp = await fetch('/api/matieres/update', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                if (resp.ok) { m[type] = newVal; renderView(); }
                else { const e = await resp.json(); alert(e.error || 'Erreur'); }
            } catch (e) { alert('Erreur réseau'); }
        }

        let data = { professors: [], matieres: [], filieres: [], timetable: [], distribution: null, rooms: [] };
        let currentView = 'filieres';
        let searchTerm = '';
        let selectedDay = 1; // 1=Lundi
        let isAnalyseMode = false;
        let selectedFilters = {
            annee: [],
            filiere: [],
            grade: [],
            status: [],
            evaluation: []
        };
        let sortBy = 'name';
        let sortDir = 'asc';
        let page = 1;
        let pageSize = 20;

        // Load data
        async function loadData() {
            try {
                const [profResp, matResp, filResp, timeResp, roomResp] = await Promise.all([
                    fetch('/api/professors'),
                    fetch('/api/matieres'),
                    fetch('/api/filieres'),
                    fetch('/api/timetable'),
                    fetch('/class.json')
                ]);
                data.professors = profResp.ok ? (await profResp.json()).professors || [] : [];
                data.matieres = matResp.ok ? (await matResp.json()).matieres || [] : [];
                data.timetable = timeResp.ok ? (await timeResp.json()).timetable || [] : [];
                data.rooms = roomResp.ok ? (await roomResp.json()) || [] : [];
                const filieresData = filResp.ok ? (await filResp.json()).filieres || [] : [];

                // Load ACTIVE distribution from Database
                try {
                    const activeResp = await fetch('/api/distribution/active');
                    if (activeResp.ok) {
                        const activeRes = await activeResp.json();
                        data.distribution = activeRes.data;
                        console.log("Active distribution loaded from DB:", data.distribution);
                    } else {
                        // Fallback to localStorage if available (for offline/preview)
                        const storedDist = localStorage.getItem('or_google_selected_distribution');
                        if (storedDist) data.distribution = JSON.parse(storedDist);
                    }
                    if (data.distribution) showDistributionContext();
                } catch (e) { console.warn("Failed to load active distribution", e); }

                data.filieres = filieresData.map(f => ({
                    ...f,
                    matieres: data.matieres.filter(m => m.filiere_id === f.id),
                    professeurs: [...new Set(data.matieres.filter(m => m.filiere_id === f.id).map(m => m.prof_nom).filter(p => !!p))]
                }));

                // FIX: Standardize property names and link subjects
                data.professors = data.professors.map(p => {
                    const profMatieres = data.matieres.filter(m => m.id_professeur === p.id);
                    const subjects = profMatieres.map(m => m.nom);
                    const specs = [...new Set(profMatieres.map(m => m.filiere_abrev || m.filiere))];
                    return {
                        ...p,
                        name: (p.full_name && p.full_name.trim() !== '') ? p.full_name : ((p.name && p.name.trim() !== '') ? p.name : 'Non Spécifié'), // Ensure "name" is used for the UI
                        matiere: subjects.length > 0 ? subjects.join(', ') : 'Aucune matière assignée',
                        filiere: specs.length > 0 ? specs.join(', ') : 'N/A'
                    };
                });

                updateStats();

                // === ROLE-BASED VIEW ===
                // If a PROFESSOR is logged in, lock them to their own matières
                if (currentUser && currentUser.role === 'PROFESSOR') {
                    // Hide full navigation, show simplified personal view
                    document.getElementById('filter-sidebar').style.display = 'none';
                    document.getElementById('search').closest('div').style.display = 'none';

                    // Filter matieres for this professor only
                    data.matieres = data.matieres.filter(m => String(m.id_professeur) === String(currentUser.prof_id));

                    // Update banner to personalized message
                    const eyebrow = document.querySelector('.eyebrow');
                    if (eyebrow) eyebrow.textContent = 'Mon Espace Professeur — ISSAT Sousse';
                    const h1 = document.querySelector('.stats-banner-title h1');
                    if (h1) h1.textContent = currentUser.full_name || 'Mon Tableau de Bord';

                    // Show the stats for just this professor
                    document.getElementById('stat-prof').textContent = '1';
                    document.getElementById('stat-mat').textContent = data.matieres.length;
                    const myFilieres = [...new Set(data.matieres.map(m => m.filiere_id))].length;
                    document.getElementById('stat-fil').textContent = myFilieres;

                    currentView = 'matieres';
                    document.getElementById('loading').style.display = 'none';
                    renderView();
                } else {
                    renderFilters();
                    renderView();
                }
            } catch (e) {
                console.error('Erreur:', e);
                document.getElementById('loading').innerHTML = '<p class="text-red-400">Erreur de chargement.</p>';
            }
        }


        function resetFilters() {
            selectedFilters = { annee: [], filiere: [], grade: [], status: [], evaluation: [] };
            searchTerm = '';
            document.getElementById('search').value = '';
            renderFilters();
            renderView();
        }

        function toggleFilter(category, value) {
            const arr = selectedFilters[category];
            const index = arr.indexOf(value);

            if (category === 'evaluation') {
                // Radio behavior for evaluation filters
                if (index > -1) {
                    selectedFilters[category] = [];
                } else {
                    selectedFilters[category] = [value];
                }
            } else {
                if (index > -1) arr.splice(index, 1);
                else arr.push(value);
            }

            page = 1;
            renderFilters();
            renderView();
        }

        function getFilteredData() {
            return getFilteredSubset(null);
        }

        function getFilteredSubset(excludeCategory) {
            if (currentView === 'filieres' || currentView === 'relations' || currentView === 'timetable') {
                return data.filieres.filter(f => {
                    const matchesSearch = !searchTerm || (f.nom || '').toLowerCase().includes(searchTerm.toLowerCase()) || (f.abrevation || '').toLowerCase().includes(searchTerm.toLowerCase());
                    const matchesAnnee = (excludeCategory === 'annee' || selectedFilters.annee.length === 0 || selectedFilters.annee.includes(f.annee));
                    const matchesSpec = (excludeCategory === 'filiere' || selectedFilters.filiere.length === 0 || selectedFilters.filiere.includes(f.nom));

                    let matchesEval = true;
                    if (excludeCategory !== 'evaluation' && selectedFilters.evaluation.length > 0) {
                        matchesEval = f.matieres.some(m => {
                            if (selectedFilters.evaluation.includes('DS') && m.ds) return true;
                            if (selectedFilters.evaluation.includes('Examen') && m.examen) return true;
                            if (selectedFilters.evaluation.includes('Aucune') && !m.ds && !m.examen) return true;
                            return false;
                        });
                    }

                    return matchesSearch && matchesAnnee && matchesSpec && matchesEval;
                });
            } else if (currentView === 'professeurs') {
                return data.professors.filter(p => {
                    const matchesSearch = !searchTerm || (p.full_name || p.name || '').toLowerCase().includes(searchTerm.toLowerCase());
                    const matchesGrade = (excludeCategory === 'grade' || selectedFilters.grade.length === 0 || selectedFilters.grade.includes(p.grade));
                    const matchesStatus = (excludeCategory === 'status' || selectedFilters.status.length === 0 || selectedFilters.status.includes(p.status ? 'Actif' : 'Inactif'));

                    let matchesSpec = true;
                    const profMatieres = data.matieres.filter(m => m.id_professeur === p.id);
                    if (excludeCategory !== 'filiere' && selectedFilters.filiere.length > 0) {
                        matchesSpec = profMatieres.some(m => selectedFilters.filiere.includes(m.filiere));
                    }

                    let matchesEval = true;
                    if (excludeCategory !== 'evaluation' && selectedFilters.evaluation.length > 0) {
                        matchesEval = profMatieres.some(m => {
                            if (selectedFilters.evaluation.includes('DS') && m.ds) return true;
                            if (selectedFilters.evaluation.includes('Examen') && m.examen) return true;
                            if (selectedFilters.evaluation.includes('Aucune') && !m.ds && !m.examen) return true;
                            return false;
                        });
                    }

                    return matchesSearch && matchesGrade && matchesStatus && matchesSpec && matchesEval;
                });
            } else if (currentView === 'matieres') {
                return data.matieres.filter(m => {
                    const matchesSearch = !searchTerm || (m.nom || '').toLowerCase().includes(searchTerm.toLowerCase());
                    const matchesAnnee = (excludeCategory === 'annee' || selectedFilters.annee.length === 0 || selectedFilters.annee.includes(m.filiere_annee));
                    const matchesSpec = (excludeCategory === 'filiere' || selectedFilters.filiere.length === 0 || selectedFilters.filiere.includes(m.filiere));

                    let matchesEval = true;
                    if (excludeCategory !== 'evaluation' && selectedFilters.evaluation.length > 0) {
                        matchesEval = false;
                        if (selectedFilters.evaluation.includes('DS') && m.ds) matchesEval = true;
                        if (selectedFilters.evaluation.includes('Examen') && m.examen) matchesEval = true;
                        if (selectedFilters.evaluation.includes('Aucune') && !m.ds && !m.examen) matchesEval = true;
                    }

                    return matchesSearch && matchesAnnee && matchesSpec && matchesEval;
                });
            } else if (currentView === 'analyse' || currentView === 'surveillance') {
                return data.matieres.filter(m => {
                    const matchesSearch = !searchTerm || (m.nom || '').toLowerCase().includes(searchTerm.toLowerCase());
                    const matchesAnnee = (excludeCategory === 'annee' || selectedFilters.annee.length === 0 || selectedFilters.annee.includes(m.filiere_annee));
                    const matchesSpec = (excludeCategory === 'filiere' || selectedFilters.filiere.length === 0 || selectedFilters.filiere.includes(m.filiere));
                    const matchesDay = (excludeCategory === 'day' || selectedDay === 0 || String(selectedDay) === String(m.jour || m.jour_num));

                    let matchesEval = true;
                    if (excludeCategory !== 'evaluation' && selectedFilters.evaluation.length > 0) {
                        matchesEval = false;
                        if (selectedFilters.evaluation.includes('DS') && m.ds) matchesEval = true;
                        if (selectedFilters.evaluation.includes('Examen') && m.examen) matchesEval = true;
                    }

                    return matchesSearch && matchesAnnee && matchesSpec && matchesEval && matchesDay;
                });
            }
            return [];
        }

        function renderFilters() {
            const container = document.getElementById('filter-groups-container');
            container.innerHTML = '';

            const groups = [];

            if (currentView === 'filieres' || currentView === 'relations' || currentView === 'matieres' || currentView === 'timetable' || currentView === 'analyse' || currentView === 'surveillance') {
                // Determine potential options based on ALL OTHER filters
                const subsetForAnnee = getFilteredSubset('annee');
                const subsetForSpec = getFilteredSubset('filiere');
                const subsetForEval = getFilteredSubset('evaluation');
                const subsetForDay = getFilteredSubset('day');

                if (currentView === 'analyse' || currentView === 'surveillance') {
                    groups.push({
                        id: 'day',
                        title: 'Jour de la Semaine',
                        options: [
                            { label: 'Tous les Jours', value: 0, count: subsetForDay.length },
                            ...[1, 2, 3, 4, 5, 6].map(d => ({
                                label: ['Lundi', 'Mardi', 'Mercredi', 'Jeudi', 'Vendredi', 'Samedi'][d - 1],
                                value: d,
                                count: subsetForDay.filter(m => String(m.jour || m.jour_num) === String(d)).length
                            }))
                        ]
                    });
                }

                groups.push({
                    id: 'annee',
                    title: 'Niveau d\'Études',
                    options: [...new Set(data.filieres.map(f => f.annee).filter(Boolean))].sort().map(a => {
                        const count = (currentView === 'matieres' || currentView === 'analyse' || currentView === 'surveillance')
                            ? subsetForAnnee.filter(m => m.filiere_annee === a || m.annee === a).length
                            : subsetForAnnee.filter(f => f.annee === a).length;
                        return {
                            label: (a || '').replace('_', ' '),
                            value: a,
                            count: count
                        };
                    })
                });

                groups.push({
                    id: 'filiere',
                    title: 'Spécialité Académique',
                    options: [...new Set(data.filieres.map(f => f.nom))].sort().map(nom => {
                        const count = (currentView === 'matieres' || currentView === 'analyse' || currentView === 'surveillance')
                            ? subsetForSpec.filter(m => m.filiere === nom).length
                            : subsetForSpec.filter(f => f.nom === nom).length;
                        return { label: nom, value: nom, count: count };
                    })
                });

                groups.push({
                    id: 'evaluation',
                    title: 'Type d\'Évaluation',
                    options: [
                        {
                            label: 'DS (Devoir)',
                            value: 'DS',
                            count: (currentView === 'matieres' || currentView === 'analyse' || currentView === 'surveillance')
                                ? subsetForEval.filter(m => m.ds).length
                                : subsetForEval.filter(f => f.matieres.some(m => m.ds)).length
                        },
                        {
                            label: 'Examen Final',
                            value: 'Examen',
                            count: (currentView === 'matieres' || currentView === 'analyse' || currentView === 'surveillance')
                                ? subsetForEval.filter(m => m.examen).length
                                : subsetForEval.filter(f => f.matieres.some(m => m.examen)).length
                        }
                    ]
                });
            }

            if (currentView === 'professeurs') {
                const subsetForSpec = getFilteredSubset('filiere');
                const subsetForGrade = getFilteredSubset('grade');
                const subsetForStatus = getFilteredSubset('status');

                groups.push({
                    id: 'filiere',
                    title: 'Filtrer par Filière',
                    options: [...new Set(data.filieres.map(f => f.nom))].sort().map(nom => {
                        const count = subsetForSpec.filter(p => {
                            const profMatieres = data.matieres.filter(m => m.id_professeur === p.id);
                            return profMatieres.some(m => m.filiere === nom);
                        }).length;
                        return { label: nom, value: nom, count: count };
                    })
                });

                groups.push({
                    id: 'grade',
                    title: 'Grade Académique',
                    options: [...new Set(data.professors.map(p => p.grade).filter(Boolean))].sort().map(g => ({
                        label: g,
                        value: g,
                        count: subsetForGrade.filter(p => p.grade === g).length
                    }))
                });

                groups.push({
                    id: 'status',
                    title: 'Statut de Disponibilité',
                    options: [
                        { label: 'Actif', value: 'Actif', count: subsetForStatus.filter(p => p.status).length },
                        { label: 'Inactif', value: 'Inactif', count: subsetForStatus.filter(p => !p.status).length }
                    ]
                });
            }

            groups.forEach(group => {
                const groupDiv = document.createElement('div');
                groupDiv.className = 'filter-group';

                const isSelected = (val) => {
                    if (group.id === 'day') return String(selectedDay) === String(val);
                    return selectedFilters[group.id].includes(val);
                };

                const validOptions = group.options.filter(opt => opt.count > 0 || isSelected(opt.value));
                if (validOptions.length === 0) return;

                let optionsHtml = validOptions.map(opt => `
                    <div class="filter-option ${isSelected(opt.value) ? 'active' : ''} ${opt.count === 0 ? 'opacity-40 grayscale pointer-events-none' : ''}" 
                         onclick="${group.id === 'day' ? `selectedDay=${opt.value}; renderView();` : `toggleFilter('${group.id}', '${opt.value}')`}">
                        <div class="cb-container"><div class="cb-mark"></div></div>
                        <span>${opt.label}</span>
                        <span class="count-pill">(${opt.count})</span>
                    </div>
                `).join('');

                groupDiv.innerHTML = `
                    <div class="filter-title" onclick="this.parentElement.classList.toggle('collapsed')">
                        ${group.title}
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
                            <path d="M6 9l6 6 6-6"></path>
                        </svg>
                    </div>
                    <div class="filter-options">${optionsHtml}</div>
                `;
                container.appendChild(groupDiv);
            });
        }

        function getGradeBadgeClass(grade) {
            if (!grade) return 'grade-default';
            const g = grade.toLowerCase();
            if (g.includes('prof') || g.includes('conf')) return 'grade-prof';
            if (g.includes('maitre')) return 'grade-maitre';
            if (g.includes('assistant')) return 'grade-assistant';
            return 'grade-default';
        }

        function getChargeClass(charge) {
            if (!charge || charge === 0) return 'charge-0';
            if (charge <= 5) return 'charge-low';
            if (charge <= 10) return 'charge-mid';
            return 'charge-high';
        }

        function showDistributionContext() {
            const badge = document.getElementById('status-badge');
            const context = document.getElementById('distribution-context');
            if (badge) badge.classList.remove('hidden');
            if (!context) return;

            const name = document.getElementById('active-dist-name');
            const meta = document.getElementById('active-dist-meta');

            if (data.distribution) {
                context.classList.remove('hidden');
                const bloc = (data.distribution.bloc || 'matin').toLowerCase().includes('matin') ? 'Matin' : 'Après-midi';
                if (name) name.textContent = `Bloc ${bloc}`;
                const date = data.distribution.timestamp ? new Date(data.distribution.timestamp).toLocaleString() : 'Date inconnue';
                if (meta) meta.textContent = `Version officielle du ${date}`;
            }
        }

        function clearDistribution() {
            localStorage.removeItem('or_google_selected_distribution');
            data.distribution = null;
            const context = document.getElementById('distribution-context');
            if (context) context.classList.add('hidden');
            renderView();
        }

        function updateStats() {
            document.getElementById('stat-prof').textContent = data.professors.length;
            document.getElementById('stat-mat').textContent = data.matieres.length;
            document.getElementById('stat-fil').textContent = data.filieres.length;
        }

        function renderView() {
            const loading = document.getElementById('loading');
            if (loading) loading.style.display = 'none';

            const content = document.getElementById('content');
            content.innerHTML = '';

            const filtered = getFilteredData();
            const countLabel = document.getElementById('results-count');
            if (countLabel) countLabel.textContent = `${filtered.length} Résultats`;

            if (currentView === 'filieres') {
                renderFilieres(content, filtered);
            } else if (currentView === 'professeurs') {
                renderProfesseurs(content, filtered);
            } else if (currentView === 'matieres') {
                renderMatieres(content, filtered);
            } else if (currentView === 'timetable') {
                renderTimetable(content, filtered);
            } else if (currentView === 'relations') {
                renderRelations(content, filtered);
            } else if (currentView === 'analyse') {
                renderAnalyse(content, filtered);
            } else if (currentView === 'surveillance') {
                renderSurveillance(content);
            }
        }

                if (data.distribution) {

                    // The distribution stores by Slot Name (e.g., "Slot 1")
                    // We need to map Slot 1 -> 08:30, Slot 2 -> 10:15, etc.
                    const dayLabels = ['Lundi', 'Mardi', 'Mercredi', 'Jeudi', 'Vendredi', 'Samedi'];

        function renderRelations(container, filtered) {
            container.innerHTML = `
                <div id="graph-container" class="w-full h-[600px]">
                    <div class="graph-legend">
                        <div class="legend-item"><span class="legend-dot" style="background:#1B3A6B"></span> Professeurs</div>
                        <div class="legend-item"><span class="legend-dot" style="background:#2D6A4F"></span> Matières</div>
                        <div class="legend-item"><span class="legend-dot" style="background:#C67C0D"></span> Filières</div>
                    </div>
                    <div id="graph-tooltip" class="tooltip"></div>
                </div>
                <div class="flex justify-between items-center mt-6">
                    <p class="text-xs text-text3 font-medium uppercase tracking-widest">Graphe Interactif des Relations Académiques</p>
                    <button class="tab !py-1 !px-4 border border-border" onclick="renderView()">Réinitialiser la Vue</button>
                </div>
            `;

            setTimeout(() => {
                const el = document.getElementById('graph-container');
                if (!el) return;
                const width = el.clientWidth;
                const height = 600;
                const tooltip = d3.select('#graph-tooltip');

                const svg = d3.select('#graph-container')
                    .append('svg')
                    .attr('width', '100%')
                    .attr('height', '100%')
                    .attr('viewBox', [0, 0, width, height]);

                const g = svg.append('g');

                svg.call(d3.zoom().on('zoom', (event) => {
                    g.attr('transform', event.transform);
                }));

                const nodes = [];
                const links = [];
                const nodeMap = new Map();

                // Build graph from FILTERED filieres
                filtered.forEach(f => {
                    const filId = 'f' + f.id;
                    if (!nodeMap.has(filId)) {
                        nodes.push({ id: filId, name: f.abrevation, type: 'filiere' });
                        nodeMap.set(filId, true);
                    }

                    f.matieres.forEach(m => {
                        const matId = 'm' + m.id;
                        if (!nodeMap.has(matId)) {
                            nodes.push({ id: matId, name: m.nom, type: 'matiere' });
                            nodeMap.set(matId, true);
                        }
                        links.push({ source: filId, target: matId });

                        if (m.id_professeur) {
                            const profId = 'p' + m.id_professeur;
                            if (!nodeMap.has(profId)) {
                                nodes.push({ id: profId, name: m.professeur, type: 'prof' });
                                nodeMap.set(profId, true);
                            }
                            links.push({ source: matId, target: profId });
                        }
                    });
                });

                if (nodes.length === 0) {
                    el.innerHTML = '<div class="h-full flex items-center justify-center text-text3 italic">Aucun node à afficher pour ces filtres.</div>';
                    return;
                }

                const simulation = d3.forceSimulation(nodes)
                    .force('link', d3.forceLink(links).id(d => d.id).distance(100))
                    .force('charge', d3.forceManyBody().strength(-400))
                    .force('center', d3.forceCenter(width / 2, height / 2))
                    .force('collide', d3.forceCollide(30));

                const link = g.append('g')
                    .attr('stroke', '#E2DDD5')
                    .attr('stroke-opacity', 0.8)
                    .selectAll('line')
                    .data(links)
                    .join('line')
                    .attr('stroke-width', 2);

                const nodeGroup = g.append('g')
                    .selectAll('g')
                    .data(nodes)
                    .join('g')
                    .on('mouseover', (event, d) => {
                        tooltip.style('opacity', 1).html(`<strong>${d.name}</strong><br>${d.type.toUpperCase()}`);
                    })
                    .on('mousemove', (event) => {
                        tooltip.style('left', (event.offsetX + 15) + 'px').style('top', (event.offsetY - 15) + 'px');
                    })
                    .on('mouseout', () => tooltip.style('opacity', 0))
                    .call(d3.drag()
                        .on('start', (event, d) => {
                            if (!event.active) simulation.alphaTarget(0.3).restart();
                            d.fx = d.x; d.fy = d.y;
                        })
                        .on('drag', (event, d) => {
                            d.fx = event.x; d.fy = event.y;
                        })
                        .on('end', (event, d) => {
                            if (!event.active) simulation.alphaTarget(0);
                            d.fx = null; d.fy = null;
                        }));

                nodeGroup.append('circle')
                    .attr('r', d => d.type === 'prof' ? 12 : (d.type === 'filiere' ? 15 : 8))
                    .attr('fill', d => {
                        if (d.type === 'prof') return '#1B3A6B';
                        if (d.type === 'matiere') return '#2D6A4F';
                        return '#C67C0D';
                    })
                    .attr('stroke', '#fff')
                    .attr('stroke-width', 2);

                nodeGroup.append('text')
                    .attr('dy', 25)
                    .attr('text-anchor', 'middle')
                    .attr('font-size', '10px')
                    .attr('font-weight', '700')
                    .attr('fill', '#4A453E')
                    .text(d => d.name);

                simulation.on('tick', () => {
                    link.attr('x1', d => d.source.x).attr('y1', d => d.source.y).attr('x2', d => d.target.x).attr('y2', d => d.target.y);
                    nodeGroup.attr('transform', d => `translate(${d.x},${d.y})`);
                });
            }, 100);
        }

                                </thead>
                                <tbody class="divide-y divide-border/10">
                                    ${roomsInBlock.map((room, idx) => {
                    const p1 = eligibleProfs[profIndex++] || '— Poste Vacant —';
                    const p2 = eligibleProfs[profIndex++] || '— Poste Vacant —';

                    return `
                                            <tr class="hover:bg-navy/[0.02] transition-colors ${idx % 2 !== 0 ? 'bg-surface/20' : 'bg-white'}">
                                                <td class="p-5 border-r border-border/10">
                                                    <div class="font-black text-lg text-navy">${room.Salle}</div>
                                                    <div class="text-[9px] text-text3 font-bold uppercase opacity-60">Capacité: ${room.CapacityTotal || room.CapaciteTotal}</div>
                                                </td>
                                                <td class="p-5 border-r border-border/10">
                                                    <div class="flex items-center gap-2">
                                                        ${p1 !== '— Poste Vacant —' ? `
                                                            <div class="w-2.5 h-2.5 rounded-full ${profsToday.includes(p1) ? 'bg-emerald-500 shadow-[0_0_8px_#10b981]' : 'bg-amber-500 shadow-[0_0_8px_#f59e0b]'}"></div>
                                                            <span class="text-sm font-bold text-text2">${p1}</span>
                                                        ` : `<span class="text-xs font-bold text-red/40 italic uppercase tracking-tighter">${p1}</span>`}
                                                    </div>
                                                </td>
                                                <td class="p-5">
                                                    <div class="flex items-center gap-2">
                                                        ${p2 !== '— Poste Vacant —' ? `
                                                            <div class="w-2.5 h-2.5 rounded-full ${profsToday.includes(p2) ? 'bg-emerald-500 shadow-[0_0_8px_#10b981]' : 'bg-amber-500 shadow-[0_0_8px_#f59e0b]'}"></div>
                                                            <span class="text-sm font-bold text-text2">${p2}</span>
                                                        ` : `<span class="text-xs font-bold text-red/40 italic uppercase tracking-tighter">${p2}</span>`}
                                                    </div>
                                                </td>
                                            </tr>
                                        `;
                }).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                `;
            });

            html += `
                <div class="mt-8 flex justify-center pb-20">
                     <button onclick="window.print()" class="premium-btn premium-btn-active !px-12 !py-5 text-sm shadow-2xl">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                            <polyline points="6 9 6 2 18 2 18 9"></polyline>
                            <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path>
                            <rect x="6" y="14" width="12" height="8"></rect>
                        </svg>
                        Imprimer le Plan Segmenté (PDF)
                    </button>
                </div>
            `;

            container.innerHTML = html;
        }

        document.querySelectorAll('.tab').forEach(t => {
            t.addEventListener('click', () => {
                // Remove 'on' from all tabs in ALL containers
                document.querySelectorAll('.tab').forEach(x => x.classList.remove('on'));
                t.classList.add('on');
                currentView = t.dataset.view;

                // If it's a view that uses filters, refresh them
                page = 1;
                renderFilters();
                renderView();
            });
        });

        document.getElementById('search').addEventListener('input', (e) => {
            searchTerm = e.target.value;
            renderView();
        });

        function initTheme() {
            const isDark = localStorage.getItem('theme') === 'dark';
            if (isDark) {
                document.documentElement.classList.add('dark-mode');
                document.querySelectorAll('.sun-icon').forEach(e => e.style.display = 'none');
                document.querySelectorAll('.moon-icon').forEach(e => e.style.display = '');
                const lbl = document.getElementById('theme-label');
                if (lbl) lbl.textContent = 'Mode Clair';
            }
        }

        // Init
        initTheme();
        checkAuth().then(() => loadData());
    </script>
</body>

</html>
